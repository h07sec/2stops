<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>Two Stops — Product Admin</title><style>
body{font:14px Arial;margin:0;background:#fafaf8;color:#111}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.panel{background:white;border:1px solid #e4e3df;padding:24px;margin:0 0 22px;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:11px;text-transform:uppercase;color:#777;margin:0 0 5px}input,select,textarea{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ddd;border-radius:4px}textarea{min-height:70px}button{padding:10px 16px;border:0;border-radius:4px;background:#111;color:white;cursor:pointer}button.alt{background:white;color:#111;border:1px solid #ddd}.row{display:flex;gap:10px;align-items:center;margin-top:16px}.thumb{width:55px;height:55px;object-fit:cover;border-radius:4px}.gate{min-height:100vh;display:grid;place-items:center}.gate .panel{width:min(360px,calc(100% - 40px))}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="gate" class="gate"><div class="panel"><h2>Product Admin</h2><p>Enter admin password.</p><input id="pw" type="password"><button id="login" style="width:100%;margin-top:10px">Unlock</button><p id="err"></p></div></div><div id="app" style="display:none"><div class="wrap"><div class="row" style="justify-content:space-between"><h1>Products</h1><div><a href="products.html">Live page</a> <button class="alt" id="logout">Log out</button></div></div><div class="panel"><h2 id="title">Add product</h2><form id="f"><input type="hidden" id="id"><div class="grid"><div><label>Gender</label><select id="gender"><option value="women">Women</option><option value="men">Men</option></select></div><div><label>Category</label><select id="category"><option>Clothing</option><option>Dresses</option><option>Tops</option><option>Bottoms</option><option>Shoes</option><option>Bags</option><option>Jewelry</option><option>Watches</option><option>Perfume</option><option>Beauty</option><option>Skincare</option><option>Gifts</option><option>Accessories</option><option>Grooming</option><option>Other</option></select></div><div class="full"><label>Product image</label><input id="image" type="file" accept="image/*"><small>JPG/PNG/WEBP/GIF, max 8 MB. On edit, leave empty to keep current image.</small></div><div><label>Name</label><input id="name" required></div><div><label>Brand</label><input id="brand"></div><div class="full"><label>Description</label><textarea id="description"></textarea></div><div><label>Price INR ₹</label><input id="price_inr"></div><div><label>Price IDR Rp</label><input id="price_idr"></div><div><label>Sizes</label><input id="sizes" placeholder="S, M, L, XL"></div><div><label>Colors</label><input id="colors" placeholder="Black, White"></div><div><label>Material</label><input id="material"></div><div><label>Sort order</label><input id="sort_order" type="number" value="0"></div><div class="full"><label>Extra details / specifications</label><textarea id="details"></textarea></div><div class="full"><label><input id="featured" type="checkbox" style="width:auto"> Featured product</label></div></div><div class="row"><button id="save">Add product</button><button type="button" class="alt" id="cancel">Cancel</button><span id="msg"></span></div></form></div><div class="panel"><h2>Live catalogue</h2><p id="count"></p><div style="overflow:auto"><table width="100%" id="table"></table></div></div></div></div><script>
const API="https://twostops-products-api.iybmickey.workers.dev";let key=sessionStorage.getItem("twostops_admin_key")||"",ps=[];
const $=x=>document.getElementById(x),esc=x=>{let d=document.createElement("div");d.textContent=x??"";return d.innerHTML};
async function login(p){try{let r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})}),d=await r.json();if(!d.ok){$("err").textContent="Wrong password";return}key=p;sessionStorage.setItem("twostops_admin_key",p);$("gate").style.display="none";$("app").style.display="block";load()}catch(e){$("err").textContent="Server connection failed"}}
if(key)login(key);$("login").onclick=()=>login($("pw").value);$("logout").onclick=()=>{sessionStorage.clear();location.reload()};
async function load(){let r=await fetch(API+"/api/products");ps=await r.json();$("count").textContent=ps.length+" products live";$("table").innerHTML="<tr><th>Image</th><th>Gender</th><th>Name</th><th>Category</th><th>Price</th><th></th></tr>"+ps.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${p.image_url}">`:"—"}</td><td>${esc(p.gender)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.price_inr?"₹"+p.price_inr:"")} ${esc(p.price_idr?"Rp "+p.price_idr:"")}</td><td><button onclick="edit('${p.id}')">Edit</button> <button onclick="delp('${p.id}')">Delete</button></td></tr>`).join("")}
window.edit=id=>{let p=ps.find(x=>x.id===id);$("id").value=p.id;["gender","category","brand","name","description","price_inr","price_idr","sizes","colors","material","details","sort_order"].forEach(k=>$(k).value=p[k]||"");$("featured").checked=!!p.featured;$("title").textContent="Edit product";$("save").textContent="Save changes";scrollTo(0,0)};
window.delp=async id=>{if(confirm("Delete this product?")){let r=await fetch(API+"/api/products/"+id,{method:"DELETE",headers:{"X-Admin-Key":key}});if(r.ok)load()}};
$("cancel").onclick=()=>location.reload();
$("f").onsubmit=async e=>{e.preventDefault();$("msg").textContent="Saving…";let fd=new FormData();["gender","category","brand","name","description","price_inr","price_idr","sizes","colors","material","details","sort_order"].forEach(k=>fd.append(k,$(k).value));fd.append("featured",$("featured").checked?"1":"0");if($("image").files[0])fd.append("image",$("image").files[0]);let id=$("id").value,r=await fetch(API+"/api/products"+(id?"/"+id:""),{method:id?"PUT":"POST",headers:{"X-Admin-Key":key},body:fd}),d=await r.json().catch(()=>({}));$("msg").textContent=r.ok?"Saved.":(d.error||"Save failed");if(r.ok){e.target.reset();$("id").value="";$("title").textContent="Add product";$("save").textContent="Add product";load()}}
</script></body></html>
